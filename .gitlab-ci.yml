15-inference:
  <<: *base
  rules:
    - if: $CI_COMMIT_BRANCH == "submits/15-inference"
  variables:
    TENSORRT_TAR: "/home/konstantin/TensorRT-10.4.0.26.Linux.x86_64-gnu.cuda-12.6.tar.gz"
  before_script:
    - ls -la /dev/nvidia* || echo "No GPU devices"
    - |
      if [ "$(id -u)" -eq 0 ]; then
        apt-get update -qq && apt-get install -y -qq cmake git clang-format ca-certificates python3 python3-pip python3-venv libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc
      else
        sudo apt-get update -qq && sudo apt-get install -y -qq cmake git clang-format ca-certificates python3 python3-pip python3-venv libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc
      fi
    - |
      set -euo pipefail
      cd "${CI_PROJECT_DIR}/15-inference"
      if ! compgen -G "TensorRT-*/include/NvInfer.h" > /dev/null; then
        if [ ! -f "${TENSORRT_TAR}" ]; then
          echo "TensorRT tarball not found: ${TENSORRT_TAR}" >&2
          echo "Укажите в GitLab CI/CD переменную TENSORRT_TAR (читаемый gitlab-runner путь) или дайте чтение на файл." >&2
          exit 1
        fi
        tar xf "${TENSORRT_TAR}" -C "${CI_PROJECT_DIR}/15-inference"
      fi
    - cd "${CI_PROJECT_DIR}"
  script:
    - mkdir -p build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Release
    - cmake --build . -j16 --target trt_server
    - cd "${CI_PROJECT_DIR}/15-inference"
    - ./run_tests.sh
    - |
      set -euo pipefail
      TRT_HOME="$(ls -d "${CI_PROJECT_DIR}/15-inference"/TensorRT-* | head -1)"
      export LD_LIBRARY_PATH="${TRT_HOME}/lib:${LD_LIBRARY_PATH:-}"
      cd "${CI_PROJECT_DIR}/build"
      ./trt_server 50051 "${CI_PROJECT_DIR}/15-inference/resnet50.onnx" &
      SERVER_PID=$!
      trap 'kill ${SERVER_PID} 2>/dev/null || true; wait ${SERVER_PID} 2>/dev/null || true' EXIT
      sleep 15
      cd "${CI_PROJECT_DIR}/15-inference"
      export INFERENCE_E2E=1
      export INFERENCE_BENCHMARK_E2E=1
      .venv/bin/python -m unittest discover -s tests -v

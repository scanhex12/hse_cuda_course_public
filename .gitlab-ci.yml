15-inference:
  <<: *base
  rules:
    - if: $CI_COMMIT_BRANCH == "submits/15-inference"
  variables:
    TENSORRT_ROOT: "/home/gitlab-runner/TensorRT-10.4.0.26"
  before_script:
    - ls -la /dev/nvidia* || echo "No GPU devices"
    - |
      if [ "$(id -u)" -eq 0 ]; then
        apt-get update -qq && apt-get install -y -qq cmake git clang-format ca-certificates python3 python3-pip python3-venv libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc
      elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
        sudo -n apt-get update -qq && sudo -n apt-get install -y -qq cmake git clang-format ca-certificates python3 python3-pip python3-venv libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc
      else
        echo "Skipping package install: runner user is not root and passwordless sudo is unavailable."
      fi
    - |
      set -euo pipefail
      if [ ! -f "${TENSORRT_ROOT}/include/NvInfer.h" ]; then
        echo "TensorRT root not found or invalid: ${TENSORRT_ROOT}" >&2
        echo "Unpack TensorRT once on the runner and set TENSORRT_ROOT to that directory." >&2
        exit 1
      fi
    - cd "${CI_PROJECT_DIR}"
  script:
    - mkdir -p build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Release
    - cmake --build . -j16 --target trt_server
    - cd "${CI_PROJECT_DIR}/15-inference"
    - ./run_tests.sh

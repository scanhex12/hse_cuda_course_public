15-inference:
  <<: *base
  cache:
    key: "${CI_PROJECT_PATH}-trt15-plans-v1"
    paths:
      - 15-inference/resnet50.onnx.fp16.trt
      - 15-inference/resnet50.onnx.fp32.trt
      - 15-inference/resnet50.onnx.fp16.timingcache
      - 15-inference/resnet50.onnx.fp32.timingcache
  rules:
    - if: $CI_COMMIT_BRANCH == "submits/15-inference"
  variables:
    TENSORRT_ROOT: "/home/gitlab-runner/TensorRT-10.4.0.26"
    TENSORRT_TAR: "/home/gitlab-runner/TensorRT-10.4.0.26.Linux.x86_64-gnu.cuda-12.6.tar.gz"
  before_script:
    - ls -la /dev/nvidia* || echo "No GPU devices"
    - |
      if [ "$(id -u)" -eq 0 ]; then
        apt-get update -qq && apt-get install -y -qq cmake git clang-format ca-certificates python3 python3-pip python3-venv libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc
      elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
        sudo -n apt-get update -qq && sudo -n apt-get install -y -qq cmake git clang-format ca-certificates python3 python3-pip python3-venv libprotobuf-dev protobuf-compiler libgrpc++-dev protobuf-compiler-grpc
      else
        echo "Skipping package install: runner user is not root and passwordless sudo is unavailable."
      fi
    - |
      set -euo pipefail
      if [ ! -f "${TENSORRT_ROOT}/include/NvInfer.h" ]; then
        if [ ! -f "${TENSORRT_TAR}" ]; then
          echo "TensorRT root not found or invalid: ${TENSORRT_ROOT}" >&2
          echo "TensorRT tarball not found: ${TENSORRT_TAR}" >&2
          exit 1
        fi

        export TENSORRT_ROOT="${CI_PROJECT_DIR}/15-inference/TensorRT-10.4.0.26"
        mkdir -p "${CI_PROJECT_DIR}/15-inference"

        # Extract the full versioned tree in one shot. A selective list from `tar tf | awk`
        # can miss entries (PAX/long names) and make `tar -T` report "Not found in archive".
        echo "TensorRT root not found; extracting TensorRT-10.4.0.26 from tarball..."
        timeout 45m tar -xf "${TENSORRT_TAR}" -C "${CI_PROJECT_DIR}/15-inference" \
          "TensorRT-10.4.0.26"

        if [ ! -d "${TENSORRT_ROOT}/lib" ] && [ -d "${TENSORRT_ROOT}/targets/x86_64-linux-gnu/lib" ]; then
          ln -s "targets/x86_64-linux-gnu/lib" "${TENSORRT_ROOT}/lib"
        fi
        if [ ! -d "${TENSORRT_ROOT}/include" ] && [ -d "${TENSORRT_ROOT}/targets/x86_64-linux-gnu/include" ]; then
          ln -s "targets/x86_64-linux-gnu/include" "${TENSORRT_ROOT}/include"
        fi
        if [ ! -f "${TENSORRT_ROOT}/include/NvInfer.h" ] || [ ! -d "${TENSORRT_ROOT}/lib" ]; then
          echo "TensorRT runtime extraction did not produce a valid TENSORRT_ROOT: ${TENSORRT_ROOT}" >&2
          exit 1
        fi
      fi
    - cd "${CI_PROJECT_DIR}"
  script:
    - mkdir -p build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Release
    - cmake --build . -j16 --target trt_server
    - cd "${CI_PROJECT_DIR}/15-inference"
    - ./run_tests.sh

